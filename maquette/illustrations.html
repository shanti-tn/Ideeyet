<title>Ideeyet Illustrations</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Krona+One&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Planche de recherche, tour 2 : variations de la comète et de la maison, valeur B retenue. */
:root {
  --cream: #FFF6ED; --paper: #FFFBF6; --ink: #1C1C1C; --grey: #606060; --line: #EADFD2;
  --f-title: "Krona One", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--cream); color: var(--grey); font-family: var(--f-body); margin: 0; line-height: 1.6; }
.wrap { max-width: 72rem; margin-inline: auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: clamp(2.5rem, 6vw, 5rem); display: grid; gap: clamp(3rem, 7vw, 5.5rem); }
header { display: grid; gap: .75rem; max-width: 40rem; }
h1 { font-family: var(--f-title); font-weight: 400; color: var(--ink); font-size: clamp(1.6rem, 1rem + 2.6vw, 2.8rem); margin: 0; text-transform: uppercase; line-height: 1.1; }
header p { margin: 0; }
.row { display: grid; gap: 1.5rem; }
.row h2 { font-family: var(--f-title); font-weight: 400; font-size: 1rem; letter-spacing: .14em; text-transform: uppercase; margin: 0; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; }
figure { margin: 0; background: var(--paper); border-radius: 1.5rem; padding: 1.25rem 1rem 1rem; display: grid; gap: .75rem; justify-items: center; border: 1px solid transparent; }
figure.now { background: transparent; border: 1px dashed var(--line); }
figure.pick { border: 2px solid #F9DA58; }
figure .pic { width: 100%; display: grid; place-items: center; }
figure svg, figure img { height: 10rem; width: auto; max-width: 100%; object-fit: contain; }
figcaption { display: grid; justify-items: center; text-align: center; gap: .1rem; }
figcaption b { color: var(--ink); font-weight: 800; font-size: .95rem; }
figcaption span { font-size: .85rem; }
@media (max-width: 860px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 380px) { figure svg, figure img { height: 8rem; } }
.ln { fill: none; stroke: #141414; stroke-width: 3.3; stroke-linecap: round; stroke-linejoin: round; }
.thin { stroke-width: 2.2; }
.dot { fill: #141414; }
.big .ln { stroke-width: 4.2; }
.big .ln.thin { stroke-width: 2.8; }
#mission-grid .ln { stroke-width: 3.8; }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="wobble" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
    <filter id="wash" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="3" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="26" result="d"/>
      <feGaussianBlur in="d" stdDeviation="5"/>
    </filter>
    <path id="spk" d="M0-12C1-4 4-1 12 0 4 1 1 4 0 12-1 4-4 1-12 0-4-1-1-4 0-12Z"/>
    <path id="ast" d="M0-8V8M-8 0H8M-5.5-5.5 5.5 5.5M5.5-5.5-5.5 5.5"/>
  </defs>
</svg>

<div class="wrap">
  <header>
    <h1>Pistes d’illustrations · tour 2</h1>
    <p>Valeurs : le soleil (B) est retenu et déjà intégré à la maquette. Pour Mission et Services, voici trois variations de vos illustrations actuelles. Dites-moi la lettre que vous préférez.</p>
  </header>

</div>
